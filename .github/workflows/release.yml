name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) throw new Error(`Invalid release tag: ${tag}`);
          for (const [file, version] of [['package.json', packageVersion], ['src-tauri/Cargo.toml', cargoVersion]]) {
            if (version !== tauriVersion) throw new Error(`${file} version ${version} does not match Tauri version ${tauriVersion}`);
          }
          if (tag !== `v${tauriVersion}`) throw new Error(`Tag ${tag} does not match application version v${tauriVersion}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE

  publish:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-latest
            args: --target aarch64-apple-darwin
            signingIdentity: "-"
          - name: macOS x64
            platform: macos-latest
            args: --target x86_64-apple-darwin
            signingIdentity: "-"
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            signingIdentity: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
            signingIdentity: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Refresh Ubuntu APT indexes
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]]; then
              sudo sed -i \
                -e 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
                -e 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' \
                "$source"
            fi
          done
          sudo apt update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
      - name: Install Linux dependencies (cached)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev libudev-dev patchelf xdg-utils
          version: 1.1
      - name: Verify Linux development libraries
        if: runner.os == 'Linux'
        run: pkg-config --print-errors --exists dbus-1 libudev webkit2gtk-4.1
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./crates/ailight-core -> target
            ./src-tauri -> target
          key: ${{ matrix.args }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.signingIdentity }}
          AILIGHT_USB_VID: ${{ vars.AILIGHT_USB_VID }}
          AILIGHT_USB_PID: ${{ vars.AILIGHT_USB_PID }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseName: AI-Light ${{ needs.validate.outputs.tag }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ contains(needs.validate.outputs.tag, '-') }}
          args: ${{ matrix.args }}
      - name: Validate macOS privacy usage descriptions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          plist_path=$(find src-tauri/target -path '*/release/bundle/macos/AI-Light.app/Contents/Info.plist' -print -quit)
          test -n "$plist_path"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSBluetoothAlwaysUsageDescription' "$plist_path")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSBluetoothPeripheralUsageDescription' "$plist_path")"

  manifest:
    name: Generate update metadata
    needs: [validate, publish]
    runs-on: ubuntu-22.04
    steps:
      - name: Generate update.json from uploaded assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$REPOSITORY/releases?per_page=100" > releases.json
          node - <<'NODE'
          const fs = require('node:fs');
          const releases = JSON.parse(fs.readFileSync('releases.json', 'utf8'));
          const release = releases.find((item) => item.tag_name === process.env.RELEASE_TAG);
          if (!release) throw new Error(`Draft release not found: ${process.env.RELEASE_TAG}`);
          const releaseBase = `https://github.com/${process.env.REPOSITORY}/releases`;
          const assets = Object.fromEntries(release.assets.map((asset) => [asset.name, {
            size: asset.size,
            sha256: asset.digest?.replace(/^sha256:/, '') ?? null,
            url: `${releaseBase}/download/${release.tag_name}/${encodeURIComponent(asset.name)}`,
          }]));
          const metadata = {
            version: release.tag_name.replace(/^v/, ''),
            releaseUrl: `${releaseBase}/tag/${release.tag_name}`,
            publishedAt: release.published_at,
            notes: release.body ?? '',
            assets,
          };
          fs.writeFileSync('update.json', `${JSON.stringify(metadata, null, 2)}\n`);
          if (Object.values(assets).some((asset) => !asset.sha256)) {
            throw new Error('GitHub did not provide a SHA-256 digest for every asset');
          }
          NODE
          gh release upload "$RELEASE_TAG" update.json --clobber --repo "$REPOSITORY"
