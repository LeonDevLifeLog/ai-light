name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) throw new Error(`Invalid release tag: ${tag}`);
          for (const [file, version] of [['package.json', packageVersion], ['src-tauri/Cargo.toml', cargoVersion]]) {
            if (version !== tauriVersion) throw new Error(`${file} version ${version} does not match Tauri version ${tauriVersion}`);
          }
          if (tag !== `v${tauriVersion}`) throw new Error(`Tag ${tag} does not match application version v${tauriVersion}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE

  publish:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-latest
            args: --target aarch64-apple-darwin
            signingIdentity: "-"
          - name: macOS x64
            platform: macos-latest
            args: --target x86_64-apple-darwin
            signingIdentity: "-"
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            signingIdentity: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
            signingIdentity: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Switch apt sources (azure mirror workaround)
        if: runner.os == 'Linux'
        run: |
          # GitHub runner 的 azure.archive.ubuntu.com 镜像偶发不可达/极慢，切到官方源
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
      - name: Install Linux dependencies (cached)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
          version: 1.0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.args }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.signingIdentity }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseName: AI-Light ${{ needs.validate.outputs.tag }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ contains(needs.validate.outputs.tag, '-') }}
          args: ${{ matrix.args }}
      - name: Validate macOS privacy usage descriptions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          plist_path=$(find src-tauri/target -path '*/release/bundle/macos/AI-Light.app/Contents/Info.plist' -print -quit)
          test -n "$plist_path"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSBluetoothAlwaysUsageDescription' "$plist_path")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSBluetoothPeripheralUsageDescription' "$plist_path")"
