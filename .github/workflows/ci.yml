name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      app: ${{ steps.filter.outputs.app }}
      adapter: ${{ steps.filter.outputs.adapter }}
      core: ${{ steps.filter.outputs.core }}
      cross-platform: ${{ steps.filter.outputs.cross_platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            app:
              - "src/**"
              - "crates/**"
              - "src-tauri/**"
              - ".github/workflows/**"
              - "index.html"
              - "package.json"
              - "pnpm-lock.yaml"
              - "components.json"
              - "tsconfig*.json"
              - "vite.config.*"
            core:
              - "crates/ailight-core/**"
            adapter:
              - "packages/ailight-adapter/**"
              - ".github/workflows/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
            cross_platform:
              - "crates/**"
              - "src-tauri/**"
              - ".github/workflows/**"
              - "package.json"
              - "pnpm-lock.yaml"
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm build

  adapter-checks:
    name: Adapter checks
    needs: quality
    if: github.event_name == 'workflow_dispatch' || needs.quality.outputs.adapter == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/ailight-adapter check
      - run: pnpm --dir packages/ailight-adapter test

  tauri-build:
    name: Tauri build (${{ matrix.name }})
    needs: quality
    if: github.event_name == 'workflow_dispatch' || needs.quality.outputs.app == 'true'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name != 'workflow_dispatch' && needs.quality.outputs.cross-platform != 'true')) && '[{"name":"Linux","platform":"ubuntu-22.04"}]' || '[{"name":"Linux","platform":"ubuntu-22.04"},{"name":"macOS","platform":"macos-latest"},{"name":"Windows","platform":"windows-latest"}]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Switch apt sources (azure mirror workaround)
        if: runner.os == 'Linux'
        run: |
          # GitHub runner 的 azure.archive.ubuntu.com 镜像偶发不可达/极慢，切到官方源
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
      - name: Install Linux dependencies (cached)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
          version: 1.0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./crates/ailight-core -> target
            ./src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Test core
        if: runner.os == 'Linux' && (github.event_name == 'workflow_dispatch' || needs.quality.outputs.core == 'true')
        run: cargo test --manifest-path crates/ailight-core/Cargo.toml
      - uses: tauri-apps/tauri-action@v1
        with:
          args: --no-bundle
