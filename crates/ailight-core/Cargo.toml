[package]
name = "ailight-core"
version = "0.1.0"
edition = "2021"
description = "AI-Light 客户端核心逻辑（协议/主题/仲裁/HTTP 接入/发送队列，无 Tauri 依赖）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
btleplug = "0.11"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
